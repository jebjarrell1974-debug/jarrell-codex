<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme:dark)">
<meta name="description" content="The Bible in Hebrew, Aramaic and Greek with every word parsed, tagged to Strong's, linked to a lexicon, a dictionary, a concordance, the places, the people, the events and the dates. Free, open, and works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarrell Codex">
<meta name="mobile-web-app-capable" content="yes">
<title>The Jarrell Codex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="ib" id="btnBooks" aria-label="Books" title="Books">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
        <path d="M4 5h16M4 12h16M4 19h16"/></svg>
    </button>
    <button class="ref" id="ref" aria-label="Choose chapter">The Jarrell Codex</button>
    <button class="ib" id="btnSearch" aria-label="Search" title="Search">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg>
    </button>
    <button class="ib" id="btnSet" aria-label="Settings" title="Settings">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/>
        <circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
    </button>
  </div>
</header>

<main id="view"><p class="load">Opening&hellip;</p></main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>

<noscript>
  <p style="padding:20px;max-width:40em;margin:0 auto">
    This reader needs JavaScript to look up words, places and dates on your phone
    without sending anything to a server. The underlying text and the full database
    are at <a href="https://github.com/jebjarrell1974-debug/jarrell-codex">github.com/jebjarrell1974-debug/jarrell-codex</a>.
  </p>
</noscript>

<script src="app.js"></script>
</body>
</html>
