# Required: every dependency in this project is AndroidX. Without this the
# build fails at :app:preDebugBuild before compiling anything.
android.useAndroidX=true

# Room's annotation processor and Kotlin need headroom on a cold build.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The database asset is already compressed; do not let AAPT try again.
android.nonTransitiveRClass=true
